id: vivid
title: Яркая живая речь
version: 1.0.0
kind: text
description: Образные, близкие публике формулировки — текст, который хочется дочитать и запомнить.
instruction: |
  Делай текст ярким, живым и близким аудитории, сохраняя точность смысла.
  - Конкретика вместо абстракций: «клиент ждёт ответа 3 минуты вместо 20», а не «повышение скорости обслуживания».
  - Активный залог и сильные глаголы; убирай пустые слова («очень», «достаточно», «определённый», «различные»).
  - Уместные образы и сравнения, понятные именно этой аудитории, — не больше одного на слайд.
  - Говори на языке слушателей: их задачи, их боли, их выгода; избегай внутреннего жаргона без пояснения.
  - Ритм: чередуй короткие и средние фразы, выделяй главное коротким ёмким пунктом.
  - Без пафоса, клише и рекламных восклицаний; эмоция должна рождаться из фактов.
  - Цифры, имена и факты из материалов не искажай.
