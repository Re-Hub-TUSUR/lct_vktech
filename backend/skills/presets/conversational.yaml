id: conversational
title: Разговорный стиль
version: 1.0.0
kind: text
description: Живая устная речь вместо канцелярита — слайды звучат так, как их расскажет докладчик.
instruction: |
  Пиши так, как говорит опытный докладчик со сцены, а не как составляют служебную записку.
  - Обращайся к аудитории на «вы», можно использовать «мы», когда речь о команде или общем деле.
  - Короткие предложения: до 12–14 слов. Одна мысль — одно предложение.
  - Глаголы вместо отглагольных существительных: «ускорили запуск», а не «осуществлено ускорение запуска».
  - Убирай канцелярит и штампы: «в рамках», «осуществлять», «является», «данный», «в целях».
  - Допустимы разговорные связки («и вот что важно», «на практике это значит»), но не больше одной на слайд.
  - Факты, цифры и названия сохраняй точно — меняется только подача.
  - В заметках докладчика формулируй текст как готовую реплику, которую можно произнести вслух.
