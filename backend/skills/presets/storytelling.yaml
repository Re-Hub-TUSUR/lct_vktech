id: storytelling
title: Сторителлинг
version: 1.0.0
kind: all
description: Колода как история — от проблемы через решение к результату, со связками между слайдами.
instruction: |
  Выстраивай презентацию как цельную историю, а не как набор независимых слайдов.
  - Структура: контекст и герой (пользователь, клиент, команда) → проблема и её цена → поиск решения → решение → результат в цифрах → что дальше.
  - Первый содержательный слайд должен зацепить: конкретная ситуация, неожиданный факт или острая проблема.
  - Каждый следующий слайд логически вытекает из предыдущего; в заметках докладчика добавляй фразу-переход к следующему слайду.
  - Используй конкретику: реальные примеры, имена ролей, ситуации из материалов — не выдумывай факты, которых нет в брифе и контент-пакете.
  - Кульминация — слайд с главным результатом или выводом; финал — чёткий призыв к действию или следующий шаг.
  - Избегай слайдов-«складов» с перечислением всего подряд: каждый слайд двигает сюжет.
