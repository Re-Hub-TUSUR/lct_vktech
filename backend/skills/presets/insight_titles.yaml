id: insight_titles
title: Заголовки-выводы
version: 1.0.0
kind: text
description: Название каждого слайда формулирует главный вывод, а не тему.
example:
  before: "Результаты пилота"
  after: "Пилот сократил время ответа клиенту вдвое"
instruction: |
  Формулируй название каждого слайда как утверждение-вывод, который зритель должен унести с этого слайда.
  - Плохо: «Выручка за 2025 год», «Результаты пилота». Хорошо: «Выручка выросла на 34% за счёт новых регионов», «Пилот сократил время обработки заявки вдвое».
  - Вывод опирается на данные самого слайда; если в материалах есть цифра — включи её.
  - Одно законченное утверждение, до 10–12 слов, без точки в конце.
  - Содержимое слайда (пункты, график, таблица) доказывает вынесенный наверх вывод и не противоречит ему.
  - Титульный слайд и слайд-разделитель оставляй короткими — правило касается содержательных слайдов.
