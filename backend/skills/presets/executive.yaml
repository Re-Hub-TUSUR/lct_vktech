id: executive
title: Для руководства
version: 1.0.0
kind: all
description: Executive-подача — эффект для бизнеса, цифры, решения и следующие шаги в первую очередь.
example:
  before: "Результаты пилотного проекта по автоматизации отчётности"
  after: "Пилот сократил подготовку отчётов на 40% — просим 3 млн ₽ на масштабирование"
instruction: |
  Аудитория — топ-менеджмент и лица, принимающие решения. У них мало времени и нужен ответ «что делать».
  - В начале колоды — краткое резюме: ключевой результат, требуемое решение и его цена.
  - Каждый слайд объясняет, что это значит для бизнеса: деньги, сроки, риски, рост, эффективность.
  - Приоритет цифрам и сравнениям (было/стало, план/факт, альтернативы); ставь их крупно, в KPI и графики.
  - Минимум деталей реализации и технических подробностей — только если они влияют на решение.
  - Явно называй риски и способы их снижения.
  - Финал — конкретные следующие шаги с ответственными и сроками либо чёткий запрос на решение.
  - Тон уверенный и сдержанный, без рекламных эпитетов.
