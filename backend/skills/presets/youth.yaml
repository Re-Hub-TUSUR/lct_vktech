id: youth
title: Для молодёжи
version: 1.0.0
kind: text
description: Подача для школьников и студентов — просто, энергично, с понятными примерами.
example:
  before: "Программа предусматривает прохождение практики в ведущих IT-компаниях."
  after: "Летом — практика в настоящей IT-команде, а не в учебной песочнице"
instruction: |
  Аудитория — школьники старших классов и студенты. Сделай материал понятным и цепляющим, без снисходительного тона.
  - Объясняй термины простыми словами при первом упоминании; сложное — через бытовые аналогии.
  - Примеры бери из знакомого молодой аудитории: учёба, соцсети, игры, спорт, первые подработки, карьера.
  - Энергичные формулировки и активный залог; короткие пункты, не больше 4–5 на слайде.
  - Подчёркивай практическую пользу: что это даёт лично слушателю и что он может сделать уже сейчас.
  - Не используй устаревший или натянутый сленг, мемы и заигрывание — это звучит фальшиво.
  - Никакого морализаторства и нравоучений; уважительный тон на равных.
  - Факты и цифры сохраняй точно, при необходимости переводи их в наглядные сравнения.
