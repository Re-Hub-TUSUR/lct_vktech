name: outline_planner
title: Планировщик структуры
version: 0.2.0
kind: agent
runtime: mock
stage: outline
model: qwen-27b
description: >
  По брифу, назначению и контент-пакету определяет состав слайдов, их порядок
  и содержание до этапа вёрстки. Сейчас — заглушка: сценарий берётся из params.storyline,
  тезисы брифа подставляются в слайд «Проблема».
prompt:
  system: |
    Ты — редактор деловых презентаций. Построй план презентации из {slides_count} слайдов.
    Назначение: {purpose}. Аудитория: {audience}. Тон: {tone}. Язык: {language}.
    У каждого слайда: тип (title, section, agenda, bullets, two_columns, cards, chart, table,
    kpi, timeline, quote, image_text, closing), тема, вывод одним предложением, тезисы
    и данные для визуализации. Для карточек — короткий заголовок и одно предложение.
    Используй только факты из материалов.
  user: |
    Название: {title}
    Бриф: {brief}
    Материалы: {sources}
    Верни JSON-массив слайдов.
params:
  purposes:
    feature:
      label: Фича
      description: Питч новой функции продукта
      subtitle: Новая функция продукта
    product:
      label: Продукт
      description: Презентация продукта или сервиса
      subtitle: Презентация продукта
    project:
      label: Проект
      description: Отчёт о ходе проекта
      subtitle: Отчёт о проекте
    initiative:
      label: Инициатива
      description: Защита инициативы или идеи
      subtitle: Защита инициативы

  # Поправки сценария под назначение: ref слайда → поля, которые заменяются.
  purpose_overrides:
    feature:
      problem: {topic: Боль пользователя}
      roadmap: {topic: План релиза, insight: Релиз фичи — через два спринта}
    project:
      problem: {topic: Исходная ситуация}
      effect: {topic: Результаты этапа}
      roadmap: {topic: Следующие шаги}
    initiative:
      problem: {topic: Почему сейчас}
      roadmap: {topic: Что нужно для запуска}

  groups:
    problem: Контекст и проблема
    solution: Решение
    results: Результаты
    plan: План

  # priority: 1 — обязательный слайд, 2 и 3 — убираются первыми, если слайдов нужно меньше.
  # flexible: true — тезисы могут быть свёрстаны списком, карточками, в две колонки или с изображением.
  # kind: data — данные, которые композитор показывает диаграммой, KPI или таблицей.
  storyline:
    - ref: cover
      kind: title
      priority: 1
      topic: "{title}"
      subtitle: "{subtitle}"

    - ref: agenda
      kind: agenda
      priority: 3
      topic: О чём поговорим
      insight: Четыре блока — от проблемы до плана внедрения

    - ref: problem
      group: problem
      kind: bullets
      flexible: true
      use_brief: true
      priority: 1
      topic: Проблема
      insight: Подготовка презентаций остаётся ручной и дорогой
      bullets:
        - Каждую неделю команды готовят десятки презентаций
        - Автор пишет текст, дизайнер вручную раскладывает его по шаблону
        - Подбор макетов, иконок и цветов занимает часы
        - Итоговые слайды часто расходятся с брендбуком
      cards:
        - {title: Десятки колод, text: Каждую неделю команды готовят десятки презентаций}
        - {title: Ручная вёрстка, text: Дизайнер вручную раскладывает текст автора по шаблону}
        - {title: Часы на подбор, text: "Подбор макетов, иконок и цветов занимает часы"}
        - {title: Мимо брендбука, text: Итоговые слайды часто расходятся с фирменным стилем}
      columns:
        - title: Как сейчас
          bullets: [Текст пишет автор, Вёрстку делает дизайнер, Правки идут по кругу]
        - title: Что мешает
          bullets: [Нет единого стандарта, Шаблоны используются неправильно, AI-сервисы ломают стиль]
      image_prompt: Команда за ноутбуками вручную собирает слайды, вокруг стопки черновиков

    - ref: cost
      group: problem
      kind: data
      priority: 2
      topic: Цена ручной вёрстки
      insight: Ручная вёрстка отнимает до 8 часов на каждую колоду
      data:
        caption: Время на подготовку одной презентации
        unit: ч
        chart_type: bar
        categories: [Текст, Вёрстка, Правки]
        series:
          - {name: Часы, values: [2, 4, 2]}
        kpis:
          - {value: 8 ч, label: на одну колоду}
          - {value: 40%, label: времени дизайнера уходит на рутину}
          - {value: 3–4, label: круга правок}
        table:
          columns: [Этап, Часы, Кто делает]
          rows:
            - [Текст, "2", Автор]
            - [Вёрстка, "4", Дизайнер]
            - [Правки, "2", Автор и дизайнер]

    - ref: solution
      group: solution
      kind: two_columns
      priority: 1
      topic: Решение
      insight: Сервис читает шаблон как набор правил и собирает слайды сам
      columns:
        - title: Что делает сервис
          bullets:
            - Разбирает шаблон на дизайн-токены и макеты
            - Строит структуру по брифу
            - Верстает слайды на макетах шаблона
        - title: Что получает команда
          bullets:
            - Готовую колоду за минуты
            - Три варианта вёрстки на выбор
            - Редактируемый .pptx без ручной правки

    - ref: how
      group: solution
      kind: timeline
      priority: 2
      topic: Как это работает
      insight: Четыре шага от брифа до готовой колоды
      timeline:
        - {date: Шаг 1, title: Шаблон, text: Загрузка и декомпозиция .pptx}
        - {date: Шаг 2, title: Бриф, text: "Назначение, тезисы и контент-пакет"}
        - {date: Шаг 3, title: Генерация, text: Три варианта вёрстки}
        - {date: Шаг 4, title: Аудит и экспорт, text: Проверка и выгрузка}

    - ref: design_system
      group: solution
      kind: bullets
      flexible: true
      priority: 3
      topic: Дизайн-система
      insight: Токены шаблона задают цвета, шрифты и сетку каждого слайда
      bullets:
        - Палитра и шрифты берутся из темы и фактического использования
        - Роли макетов определяются автоматически
        - Графики и таблицы окрашиваются цветами шаблона
      cards:
        - {title: Палитра и шрифты, text: Из темы шаблона и фактического использования}
        - {title: Паттерны слайдов, text: "Карточки, KPI и таймлайны из слайдов-примеров"}
        - {title: Роли макетов, text: "Обложка, раздел и контент определяются автоматически"}
      columns:
        - title: Из шаблона
          bullets: [Палитра и шрифты, Типографическая шкала, Макеты и плейсхолдеры]
        - title: В слайдах
          bullets: [Цвета графиков и таблиц, Роли макетов, Сетка и отступы]
      image_prompt: Абстрактная иллюстрация дизайн-системы — сетка, палитра и слои слайдов

    - ref: effect
      group: results
      kind: data
      priority: 1
      topic: Эффект
      insight: Время подготовки сокращается с часов до минут
      data:
        caption: Время подготовки колоды из 12 слайдов, мин
        unit: мин
        chart_type: bar
        categories: [Вручную, AI-ассистент, Наш сервис]
        series:
          - {name: Минуты, values: [480, 180, 5]}
        kpis:
          - {value: ×96, label: "быстрее, чем вручную"}
          - {value: 5 мин, label: на генерацию колоды}
          - {value: 95%, label: слайдов без ручных правок}
        table:
          columns: [Показатель, Вручную, Сервис]
          rows:
            - [Время подготовки, 8 ч, 5 мин]
            - [Соответствие брендбуку, ~70%, 95%]
            - [Кругов правок, 3–4, "1"]

    - ref: dynamics
      group: results
      kind: data
      priority: 3
      topic: Динамика пилота
      insight: Доля колод без ручных правок растёт каждый месяц
      data:
        caption: Колоды без ручных правок, %
        unit: "%"
        chart_type: line
        categories: [Июль, Август, Сентябрь, Октябрь]
        series:
          - {name: Команда A, values: [55, 68, 81, 92]}
          - {name: Команда B, values: [40, 57, 70, 86]}
        kpis:
          - {value: 92%, label: команда A в октябре}
          - {value: +46 п.п., label: рост у команды B}
        table:
          columns: [Месяц, Команда A, Команда B]
          rows:
            - [Июль, 55%, 40%]
            - [Август, 68%, 57%]
            - [Сентябрь, 81%, 70%]
            - [Октябрь, 92%, 86%]

    - ref: comparison
      group: results
      kind: table
      priority: 2
      topic: Сравнение с альтернативами
      insight: Только сервис сохраняет дизайн-систему шаблона
      table:
        columns: [Критерий, Вручную, AI-сервисы, Наш сервис]
        rows:
          - [Скорость, Низкая, Высокая, Высокая]
          - [Фирменный стиль, Да, Нет, Да]
          - [Редактируемый .pptx, Да, Частично, Да]
          - [Аудит качества, Вручную, Нет, Автоматически]

    - ref: principle
      group: results
      kind: quote
      priority: 3
      topic: Принцип
      insight: Каждый слайд должен нести вывод
      quote:
        text: Хорошая презентация — это вывод на каждом слайде, а не набор тем
        author: Принцип редактора сервиса

    - ref: roadmap
      group: plan
      kind: timeline
      priority: 1
      topic: Дорожная карта
      insight: Пилот стартует в этом квартале
      timeline:
        - {date: Q4 2026, title: Пилот, text: Две команды и три шаблона}
        - {date: Q1 2027, title: Масштабирование, text: Новые шаблоны и команды}
        - {date: Q2 2027, title: Интеграции, text: "Диск, почта и мессенджер"}
        - {date: Q3 2027, title: Эксплуатация, text: SLA и мониторинг качества}

    - ref: summary
      group: plan
      kind: bullets
      flexible: true
      priority: 1
      topic: Итоги
      insight: Сервис готов к пилоту уже сейчас
      bullets:
        - Шаблон разбирается автоматически, без ручной настройки
        - Три варианта вёрстки на выбор
        - Аудит находит ошибки до показа
        - Экспорт в редактируемый .pptx, .pdf и .html
      cards:
        - {title: Без настройки, text: Шаблон разбирается автоматически}
        - {title: Три варианта, text: Вёрстка на выбор под задачу}
        - {title: Аудит, text: Ошибки находятся до показа}
        - {title: Экспорт, text: "Редактируемый .pptx, .pdf и .html"}
      image_prompt: Готовая презентация на экране ноутбука, три варианта вёрстки рядом

    - ref: closing
      kind: closing
      priority: 1
      topic: Спасибо!
      subtitle: Вопросы и обсуждение
