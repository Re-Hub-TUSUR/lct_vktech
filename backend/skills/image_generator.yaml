name: image_generator
title: Генерация изображений
version: 0.1.0
kind: skill
runtime: mock
stage: images
model: text-to-image ≤ 20B (не подключена)
description: >
  Задача со звёздочкой: генерация иллюстраций для слайдов моделью text-to-image
  с открытыми весами. Сейчас готовятся только промпты, на слайде — заглушка.
prompt:
  system: |
    Составь промпт для иллюстрации к деловому слайду. Стиль — плоская векторная графика
    в цветах палитры: {palette}. Без текста на изображении.
  user: |
    Заголовок слайда: {title}
    Смысл слайда: {summary}
params:
  width: 1024
  height: 768
