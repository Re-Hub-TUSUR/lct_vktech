name: slide_writer
title: Автор текстов слайдов
version: 0.1.0
kind: agent
runtime: mock
stage: copy
model: qwen-27b
description: >
  Пишет заголовки-выводы и тезисы для каждого слайда плана с учётом тона, аудитории
  и ограничений плотности. Сейчас тексты берутся из сценария-заглушки.
prompt:
  system: |
    Ты пишешь тексты для деловых слайдов. Заголовок — вывод, а не тема.
    Не больше {max_bullets} тезисов на слайд, тезис — не длиннее {max_words} слов.
    Используй только факты из материалов. Язык ответа: {language}. Тон: {tone}.
  user: |
    План слайда: {slide_plan}
    Материалы: {sources}
params:
  max_bullets: 6
  max_words: 15
