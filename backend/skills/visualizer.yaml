name: visualizer
title: Визуализация данных
version: 0.2.0
kind: skill
runtime: code
stage: visuals
model: null
description: >
  Доводит данные слайдов до ясной визуализации по правилам (pipeline/visuals/visualizer.py):
  тип диаграммы выбирается по данным (доли — круговая, динамика — линия, длинные подписи —
  горизонтальные столбцы), сравнение сортируется по убыванию, ключевое значение выделяется
  акцентом шаблона, числа округляются, у таблиц, KPI и таймлайнов — чистые подписи и объём в
  пределах лимитов аудита. При экспорте всё выгружается нативными объектами в цветах шаблона.
params:
  # Диаграммы
  max_categories: 8          # больше категорий не читаются: для сравнения остаются лидеры, для динамики — последние точки
  max_series: 5              # лимит аудита density.chart_series
  pie_max_parts: 6           # круговая — только для долей целого: не больше стольких частей
  pie_sum_tolerance: 5       # доли в процентах должны давать 100 ± столько
  long_label_chars: 14       # подписи длиннее — горизонтальные столбцы, чтобы подписи не ломались
  min_line_points: 3         # линия — для динамики минимум по стольким точкам
  # Подписи-периоды: по ним категории распознаются как ось времени (порядок не меняется, подходит линия).
  temporal_rx: "^((19|20)\\d{2}|q[1-4]|[1-4]\\s*кв|кв\\.?\\s*[1-4]|h[12]|[12]\\s*п/?г|янв|фев|мар|апр|ма[йя]|июн|июл|авг|сен|окт|ноя|дек|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|недел|месяц|год|день|шаг|этап|\\d{1,2}[./]\\d{2})"
  # Таблицы, KPI, таймлайны — лимиты аудита (skills/auditor.yaml) и вёрстки
  max_table_rows: 7
  max_table_cols: 5
  max_kpis: 4
  max_kpi_value_chars: 10
  max_timeline: 6
