name: template_parser
title: Декомпозиция шаблона
version: 0.5.0
kind: skill
runtime: code
stage: template
model: VLM ≤ 35B, опционально (VLM_MODEL)
description: >
  Разбирает .pptx без привязки к конкретному шаблону. Тема, фактическая палитра, гарнитуры,
  типографическая шкала, макеты и их роли. Главное — паттерны слайдов-примеров: назначение
  (контент, обложка, финал, визитка, код, цитата, витрина иконок), тип (карточки, KPI, таймлайн,
  текст, таблица, текст с изображением, оглавление), слоты с ролями и ёмкостью в знаках,
  повторяющиеся элементы со всеми их фигурами, декор, привязанный к слотам, диаграммы,
  служебные слайды (обложка, разделитель, финал) и паттерны из макетов для шаблонов почти без
  примеров. Токены дизайн-системы: типографика по ролям, сетка и поля, колонтитулы и логотипы,
  стиль таблиц и диаграмм, доступность шрифтов, пиктограммы. Форматы .potx, .pptm, .ppt, .odp
  приводятся к .pptx. Рендеры слайдов и макетов — LibreOffice. Если задан VLM_MODEL, модель
  уточняет назначение, тип и роли по рендеру.
prompt:
  system: |
    Ты — дизайнер презентаций. Тебе показывают слайд-пример из корпоративного шаблона и список
    его текстовых фигур с ролями, которые предложил алгоритм. Определи, для какого содержания
    предназначен слайд, и исправь роли фигур, если алгоритм ошибся. Не придумывай фигуры —
    используй только id из списка. Отвечай только JSON без пояснений.
  user: |
    Фигуры слайда (координаты в долях слайда):
    {shapes}

    Алгоритм определил назначение слайда: {heuristic_category}, тип паттерна: {heuristic_type}.
    Допустимые назначения: {categories} (под обычный контент идёт только content).
    Допустимые типы: {types}.
    Допустимые роли фигур: {roles}.

    Верни JSON:
    {"type": "<тип>", "category": "<назначение>", "purpose": "<для чего этот слайд, одним предложением>",
     "usage": "<какой контент сюда подходит>", "confidence": <от 0 до 1>,
     "roles": {"<id>": "<роль>"}}
    В roles укажи только фигуры, роль которых нужно изменить.
params:
  # Регулярные выражения по названию макета. Порядок важен: первое совпадение задаёт роль.
  role_patterns:
    closing: "спасиб|финал|thank|q\\s*&\\s*a|вопрос|\\bend\\b"
    section: "раздел|section|divider"
    agenda: "содержан|оглавлен|agenda|contents"
    title: "титул|обложк|title slide|cover"
  two_columns_hint: "колон|column|2 объекта|два|two"
  image_hint: "фото|photo|picture|image|изображ|картин"
  palette_size: 12
  fonts_limit: 8
  type_scale_limit: 14
