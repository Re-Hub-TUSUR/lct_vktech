name: slide-designer

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-slides}
  REDIS_URL: redis://redis:6379/0
  STORAGE_DIR: /data
  BUILTIN_TEMPLATES_DIR: /builtin_templates
  TEMPLATE_CACHE_DIR: ${TEMPLATE_CACHE_DIR:-/cache}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
  RENDER_TIMEOUT_SECONDS: ${RENDER_TIMEOUT_SECONDS:-420}
  RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-1}
  # LLM для плана колоды и текстов слайдов (необязательно): OpenAI-совместимый API.
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
  LLM_CONCURRENCY: ${LLM_CONCURRENCY:-4}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1600}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
  LLM_DISABLE_REASONING: ${LLM_DISABLE_REASONING:-true}
  LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
  LLM_SOURCE_CHARS: ${LLM_SOURCE_CHARS:-4000}
  LLM_SOURCES_TOTAL_CHARS: ${LLM_SOURCES_TOTAL_CHARS:-12000}
  # Модель-судья аудита (необязательно): пустые поля берутся из LLM_*.
  AUDIT_BASE_URL: ${AUDIT_BASE_URL:-}
  AUDIT_API_KEY: ${AUDIT_API_KEY:-}
  AUDIT_MODEL: ${AUDIT_MODEL:-}
  AUDIT_TIMEOUT_SECONDS: ${AUDIT_TIMEOUT_SECONDS:-180}
  AUDIT_MAX_TOKENS: ${AUDIT_MAX_TOKENS:-6000}
  AUDIT_CONCURRENCY: ${AUDIT_CONCURRENCY:-6}
  AUDIT_WAIT_SECONDS: ${AUDIT_WAIT_SECONDS:-60}
  # VLM для разметки паттернов слайдов (необязательно): OpenAI-совместимый API.
  VLM_BASE_URL: ${VLM_BASE_URL:-}
  VLM_API_KEY: ${VLM_API_KEY:-}
  VLM_MODEL: ${VLM_MODEL:-}
  VLM_TIMEOUT_SECONDS: ${VLM_TIMEOUT_SECONDS:-90}
  VLM_MAX_PATTERNS: ${VLM_MAX_PATTERNS:-60}
  VLM_CONCURRENCY: ${VLM_CONCURRENCY:-6}
  VLM_MAX_TOKENS: ${VLM_MAX_TOKENS:-900}
  VLM_DISABLE_REASONING: ${VLM_DISABLE_REASONING:-true}
  VLM_EXTRA_BODY: ${VLM_EXTRA_BODY:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-slides}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 20s
    # tini в роли PID 1 подбирает завершившиеся процессы LibreOffice, иначе копятся зомби.
    init: true
    environment: *backend-env
    # Миграции → регистрация встроенных шаблонов → API.
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - storage:/data
      - ./shablon:/builtin_templates:ro
      # Готовый разбор шаблонов контент-пакета: первый запуск без LibreOffice и без VLM.
      - ./cache:/cache:ro
    dns:
      - 77.88.8.8
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 20s
    # tini в роли PID 1 подбирает завершившиеся процессы LibreOffice, иначе копятся зомби.
    init: true
    environment: *backend-env
    command: ["arq", "app.worker.WorkerSettings"]
    dns:
      - 77.88.8.8
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - storage:/data
      - ./shablon:/builtin_templates:ro
      # Воркер разбирает шаблоны и пополняет кэш, поэтому каталог доступен на запись.
      - ./cache:/cache
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  storage:
